<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 900" width="1260" height="900" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333333"/></marker>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b85450"/></marker>
    <marker id="ag" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#82b366"/></marker>
    <marker id="ap" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#9673a6"/></marker>
    <marker id="aps" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#9673a6"/></marker>
    <marker id="ab" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6c8ebf"/></marker>
  </defs>

  <rect x="0" y="0" width="1260" height="900" fill="#ffffff"/>

  <text x="60" y="58" font-size="20" font-weight="bold" fill="#1a1a1a">Visual Product Search — CLIP retrieval with a check-and-repair loop</text>

  <rect x="330" y="90" width="380" height="60" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="520" y="112" font-size="13" text-anchor="middle" fill="#1a1a1a">Browser UI</text>
  <text x="520" y="131" font-size="11" text-anchor="middle" fill="#333333">image upload + text query · results list · search trace</text>

  <rect x="60" y="180" width="1000" height="690" rx="6" fill="none" stroke="#666666" stroke-dasharray="6 4"/>
  <text x="74" y="202" font-size="13" font-style="italic" fill="#555555">docker-compose</text>

  <rect x="90" y="225" width="700" height="620" rx="6" fill="#f5f5f5" stroke="#999999"/>
  <text x="104" y="247" font-size="13" font-weight="bold" fill="#333333">api service (FastAPI)</text>

  <rect x="120" y="270" width="290" height="50" rx="6" fill="#ffffff" stroke="#666666"/>
  <text x="265" y="290" font-size="12" text-anchor="middle" fill="#1a1a1a">API key auth</text>
  <text x="265" y="307" font-size="10" text-anchor="middle" fill="#555555">upload size · decoded-image check</text>

  <rect x="440" y="270" width="330" height="50" rx="6" fill="#ffffff" stroke="#666666"/>
  <text x="605" y="300" font-size="12" text-anchor="middle" fill="#1a1a1a">POST /search · POST /embed · GET /ready</text>

  <rect x="120" y="345" width="650" height="425" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="560" y="367" font-size="12" font-weight="bold" fill="#7a6320">Search loop — max 3 iterations</text>

  <rect x="150" y="390" width="230" height="55" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="265" y="412" font-size="12" text-anchor="middle" fill="#1a1a1a">1 · Read request</text>
  <text x="265" y="429" font-size="10" text-anchor="middle" fill="#555555">rules on the catalogue's own labels</text>

  <rect x="150" y="475" width="230" height="55" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="265" y="497" font-size="12" text-anchor="middle" fill="#1a1a1a">2 · Retrieve</text>
  <text x="265" y="514" font-size="10" text-anchor="middle" fill="#555555">vector kNN + payload filter</text>

  <rect x="150" y="560" width="230" height="75" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="265" y="582" font-size="12" text-anchor="middle" fill="#1a1a1a">3 · Check</text>
  <text x="265" y="600" font-size="10" text-anchor="middle" fill="#555555">price, category and colour</text>
  <text x="265" y="616" font-size="10" text-anchor="middle" fill="#555555">matched on indexed metadata</text>

  <rect x="150" y="685" width="230" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="265" y="710" font-size="12" text-anchor="middle" fill="#1a1a1a">4 · Rank top 5</text>
  <text x="265" y="727" font-size="10" text-anchor="middle" fill="#555555">CLIP similarity order</text>

  <polygon points="460,595 550,545 640,595 550,645" fill="#ffffff" stroke="#666666"/>
  <text x="550" y="591" font-size="12" text-anchor="middle" fill="#1a1a1a">constraints</text>
  <text x="550" y="607" font-size="12" text-anchor="middle" fill="#1a1a1a">met?</text>

  <rect x="460" y="405" width="180" height="60" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="550" y="430" font-size="12" text-anchor="middle" fill="#1a1a1a">Repair</text>
  <text x="550" y="447" font-size="10" text-anchor="middle" fill="#555555">relax filter · rewrite query</text>

  <rect x="120" y="785" width="650" height="45" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="445" y="803" font-size="12" text-anchor="middle" fill="#1a1a1a">CLIP ViT-B/32 (ONNX) — the served model, runs locally</text>
  <text x="445" y="820" font-size="10" text-anchor="middle" fill="#555555">image + text embeddings for indexing and search</text>

  <rect x="830" y="470" width="200" height="110" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="930" y="507" font-size="12" text-anchor="middle" fill="#1a1a1a">Qdrant</text>
  <text x="930" y="527" font-size="10" text-anchor="middle" fill="#555555">image + text vectors</text>
  <text x="930" y="543" font-size="10" text-anchor="middle" fill="#555555">payload: price, colour,</text>
  <text x="930" y="558" font-size="10" text-anchor="middle" fill="#555555">category</text>



  <rect x="1080" y="680" width="160" height="110" rx="0" fill="none" stroke="#b3b3b3" stroke-dasharray="4 3"/>
  <text x="1095" y="704" font-size="12" font-weight="bold" fill="#333333">Legend</text>
  <rect x="1095" y="720" width="18" height="18" fill="#d5e8d4" stroke="#82b366"/>
  <text x="1122" y="734" font-size="11" fill="#333333">search step (code)</text>
  <rect x="1095" y="755" width="18" height="18" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="1122" y="769" font-size="11" fill="#333333">local service / model</text>

  <path d="M425,150 L425,245 L265,245 L265,270" fill="none" stroke="#333333" marker-end="url(#a)"/>
  <path d="M410,295 L440,295" fill="none" stroke="#333333" marker-end="url(#a)"/>
  <path d="M522,320 L522,335 L110,335 L110,417 L150,417" fill="none" stroke="#333333" marker-end="url(#a)"/>
  <path d="M265,445 L265,475" fill="none" stroke="#333333" marker-end="url(#a)"/>
  <path d="M265,530 L265,560" fill="none" stroke="#333333" marker-end="url(#a)"/>
  <path d="M380,596 L460,595" fill="none" stroke="#333333" marker-end="url(#a)"/>
  <path d="M550,545 L550,465" fill="none" stroke="#b85450" marker-end="url(#ar)"/>
  <text x="560" y="510" font-size="11" fill="#b85450">no</text>
  <path d="M460,435 L420,435 L420,502 L380,502" fill="none" stroke="#b85450" marker-end="url(#ar)"/>
  <text x="392" y="455" font-size="11" fill="#b85450">re-query</text>
  <path d="M550,645 L550,715 L380,715" fill="none" stroke="#82b366" marker-end="url(#ag)"/>
  <text x="560" y="672" font-size="11" fill="#82b366">yes</text>
  <path d="M380,489 L410,489 L410,525 L830,525" fill="none" stroke="#9673a6" marker-end="url(#ap)" marker-start="url(#aps)"/>
  <text x="640" y="519" font-size="11" text-anchor="middle" fill="#9673a6">kNN + payload filter</text>
  <path d="M150,502 L105,502 L105,807 L120,807" fill="none" stroke="#9673a6" marker-end="url(#ap)"/>
  <text x="112" y="660" font-size="11" fill="#9673a6" transform="rotate(-90 112,660)" text-anchor="middle">embed query</text>
  <path d="M687,270 L687,170 L615,170 L615,150" fill="none" stroke="#6c8ebf" stroke-dasharray="6 4" marker-end="url(#ab)"/>
  <text x="700" y="200" font-size="11" fill="#6c8ebf">results + trace (streamed)</text>
</svg>
