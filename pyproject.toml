[project]
name = "rdai-project"
version = "0.1.0"
description = "Multimodal agentic RAG for visual product search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.12",
    "fastembed>=0.4",
    "openai>=1.54",
    "pillow>=11.0",
    "numpy>=2.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
